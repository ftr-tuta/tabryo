name: Desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            device: windows
          - os: ubuntu-24.04
            device: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        # All required packages come from Ubuntu. Unrelated runner repositories
        # (for example Chrome) can have temporarily inconsistent package indexes.
        run: |
          sources=/etc/apt/sources.list.d/ubuntu.sources
          test -f "$sources"
          sudo apt-get -o Dir::Etc::sourcelist="$sources" -o Dir::Etc::sourceparts=- update
          sudo apt-get -o Dir::Etc::sourcelist="$sources" -o Dir::Etc::sourceparts=- install -y clang clangd cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xdotool openbox
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/editor_web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: packages/editor_web
      - run: npm run build
        working-directory: packages/editor_web
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Configure Flutter desktop target
        # Qualify the native desktop host without the runner's unrelated ADB
        # server interfering with Flutter daemon discovery and process teardown.
        run: flutter config --enable-${{ matrix.device }}-desktop --no-enable-android
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install native project tools
        run: python -m pip install uv==0.8.22 poetry==2.2.1 ruff==0.16.6 black==26.5.1 pytest==9.0.2 pytest-cov==7.1.0 debugpy==1.8.21 Django==6.1.1 fastapi==0.140.6 uvicorn==0.52.4
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: dart run dartitect_cli:dartitect scan
      - name: Native C++ compiler language server and debugger
        shell: pwsh
        run: |
          $nativeRoot = Join-Path $env:RUNNER_TEMP 'native-cpp'
          New-Item -ItemType Directory -Path $nativeRoot -Force | Out-Null
          $platform = if ($IsWindows) { 'win32' } else { 'linux' }
          $adapterArchive = Join-Path $nativeRoot 'codelldb.zip'
          Invoke-WebRequest "https://github.com/vadimcn/codelldb/releases/download/v1.12.3/codelldb-$platform-x64.vsix" -OutFile $adapterArchive
          $expected = if ($IsWindows) { 'a916e509308dac817732f63ca604a8b93ed29cd16f38a2fa9f0b64ed58e8f51a' } else { '1cd7f386598022b51a5b93b9ffa23e812b23f519cfe1833384ec4bef4bfd1be1' }
          if ((Get-FileHash $adapterArchive -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'CodeLLDB checksum mismatch.' }
          Expand-Archive -LiteralPath $adapterArchive -DestinationPath $nativeRoot
          if ($IsWindows) {
            $clangdArchive = Join-Path $nativeRoot 'clangd.zip'
            Invoke-WebRequest 'https://github.com/clangd/clangd/releases/download/22.1.6/clangd-windows-22.1.6.zip' -OutFile $clangdArchive
            if ((Get-FileHash $clangdArchive -Algorithm SHA256).Hash.ToLower() -ne 'ce54f16e0b4fd76d450eeda9664420b195360b73febcfe40e661108fa57f2ce1') { throw 'clangd checksum mismatch.' }
            Expand-Archive -LiteralPath $clangdArchive -DestinationPath $nativeRoot
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            $cmake = Join-Path $vs 'Common7/IDE/CommonExtensions/Microsoft/CMake'
            $env:TABRYO_TEST_CMAKE = Join-Path $cmake 'CMake/bin/cmake.exe'
            $env:TABRYO_TEST_CTEST = Join-Path $cmake 'CMake/bin/ctest.exe'
            $env:TABRYO_TEST_NINJA = Join-Path $cmake 'Ninja/ninja.exe'
            $env:TABRYO_TEST_CXX = 'cl.exe'
            $env:TABRYO_TEST_MSVC_ENV = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
            $env:TABRYO_TEST_CLANGD = (Get-ChildItem $nativeRoot -Recurse -Filter clangd.exe).FullName
            $env:TABRYO_TEST_CODELLDB = Join-Path $nativeRoot 'extension/adapter/codelldb.exe'
          } else {
            chmod +x "$nativeRoot/extension/adapter/codelldb"
            $env:TABRYO_TEST_CMAKE = '/usr/bin/cmake'
            $env:TABRYO_TEST_CTEST = '/usr/bin/ctest'
            $env:TABRYO_TEST_NINJA = '/usr/bin/ninja'
            $env:TABRYO_TEST_CXX = '/usr/bin/clang++'
            $env:TABRYO_TEST_CLANGD = '/usr/bin/clangd'
            $env:TABRYO_TEST_CODELLDB = Join-Path $nativeRoot 'extension/adapter/codelldb'
          }
          $env:TABRYO_TEST_NATIVE_GAME = '1'
          flutter test test/game_development_test.dart --plain-name 'native C++ workflow' --concurrency=1
          exit $LASTEXITCODE
      - run: flutter test --concurrency=1
        env:
          TABRYO_TEST_PROJECT_SETUP: '1'
          TABRYO_TEST_LANGUAGE_PYTHON: '1'
          TABRYO_TEST_TASKS: '1'
          TABRYO_TEST_DEBUG_PYTHON: '1'
      - name: Windows Flutter debugger integration
        if: runner.os == 'Windows'
        run: flutter test test/debugger_test.dart --plain-name "Flutter discovers" --concurrency=1
        env:
          TABRYO_TEST_FLUTTER_DEBUG: '1'
      - name: Linux Flutter debugger integration
        if: runner.os == 'Linux'
        run: xvfb-run -a flutter test test/debugger_test.dart --plain-name "Flutter discovers" --concurrency=1
        env:
          TABRYO_TEST_FLUTTER_DEBUG: '1'
      - name: Windows native terminal tests
        if: runner.os == 'Windows'
        run: flutter test integration_test/terminal_host_test.dart -d windows
      - name: Linux native terminal tests
        if: runner.os == 'Linux'
        run: xvfb-run -a flutter test integration_test/terminal_host_test.dart -d linux
      - name: Native Codex editor context and MCP integration
        shell: pwsh
        run: |
          $codexRoot = Join-Path $env:RUNNER_TEMP 'tabryo-codex'
          npm install --prefix $codexRoot --no-save --ignore-scripts --no-audit --no-fund '@openai/codex@0.147.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $platform = if ($IsWindows) { 'win32' } else { 'linux' }
          $binary = if ($IsWindows) { 'codex.exe' } else { 'codex' }
          $package = Join-Path $codexRoot "node_modules/@openai/codex-$platform-x64"
          $executables = @(Get-ChildItem -LiteralPath $package -Recurse -File -Filter $binary)
          if ($executables.Count -ne 1) { throw 'Expected one installed native Codex executable.' }
          $env:TABRYO_TEST_CODEX = $executables[0].FullName
          $flutterBin = Split-Path (Get-Command flutter).Source
          $dartBinary = if ($IsWindows) { 'dart.exe' } else { 'dart' }
          $env:TABRYO_TEST_DART = Join-Path $flutterBin "cache/dart-sdk/bin/$dartBinary"
          if ($IsWindows) {
            $env:PATH = "${PWD}/build/windows/x64/runner/Debug;$env:PATH"
          } else {
            $env:LD_LIBRARY_PATH = "${PWD}/build/linux/x64/debug/bundle/lib:$env:LD_LIBRARY_PATH"
          }
          flutter test test/collaboration_sessions_test.dart test/codex_sessions_test.dart test/mcp_codex_test.dart --concurrency=1 --name 'installed Codex uses authenticated collaboration MCP|steering reaches the active turn|installed Codex|native approval is shared|standalone client'
          exit $LASTEXITCODE
      - name: Windows desktop integration
        if: runner.os == 'Windows'
        run: flutter test integration_test/workbench_test.dart -d windows
      - name: Windows embedded editor integration
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: flutter test integration_test/editor_test.dart -d windows
      - name: Linux desktop integration
        if: runner.os == 'Linux'
        run: xvfb-run -a sh -eu -c 'openbox >/dev/null 2>&1 & wm=$!; trap "kill $wm 2>/dev/null || true" EXIT; flutter test integration_test/workbench_test.dart -d linux'
      - name: Linux embedded editor integration
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: xvfb-run -a flutter test integration_test/editor_test.dart -d linux --reporter expanded
        env:
          LC_ALL: C
      - name: Linux HiDPI editor and shared windows integration
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          xvfb-run -a -s '-screen 0 2560x1600x24' flutter test integration_test/editor_test.dart -d linux --reporter expanded
          xvfb-run -a -s '-screen 0 2560x1600x24' sh -eu -c 'openbox >/dev/null 2>&1 & wm=$!; trap "kill $wm 2>/dev/null || true" EXIT; flutter test integration_test/workbench_test.dart -d linux --plain-name "shared windows" --reporter expanded'
        env:
          GDK_SCALE: '2'
          GDK_DPI_SCALE: '0.5'
      - name: Linux Release editor integration
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          flutter build linux --release -t integration_test/editor_test.dart
          xvfb-run -a build/linux/x64/release/bundle/tabryo
      - name: Preserve Linux editor integration for Arch compatibility
        if: runner.os == 'Linux'
        run: tar -czf "$RUNNER_TEMP/editor-linux.tar.gz" -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: editor-linux-${{ github.sha }}
          path: ${{ runner.temp }}/editor-linux.tar.gz
          retention-days: 7
          if-no-files-found: error
      - name: Windows Release editor integration
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          flutter build windows --release -t integration_test/editor_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = Start-Process -FilePath build/windows/x64/runner/Release/tabryo.exe -Wait -PassThru -NoNewWindow
          exit $app.ExitCode
      - name: Build Release integration entrypoint for memory observation
        run: flutter build ${{ matrix.device }} --release -t integration_test/workbench_test.dart
      - name: Windows Release integration and memory
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $app = Start-Process -FilePath build/windows/x64/runner/Release/tabryo.exe -Wait -PassThru -NoNewWindow
          exit $app.ExitCode
      - name: Linux Release integration and memory
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: xvfb-run -a sh -eu -c 'openbox >/dev/null 2>&1 & wm=$!; trap "kill $wm 2>/dev/null || true" EXIT; build/linux/x64/release/bundle/tabryo'
      - name: Preserve Linux workbench integration for Arch compatibility
        if: runner.os == 'Linux'
        run: tar -czf "$RUNNER_TEMP/workbench-linux.tar.gz" -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: workbench-linux-${{ github.sha }}
          path: ${{ runner.temp }}/workbench-linux.tar.gz
          retention-days: 7
          if-no-files-found: error
      - run: flutter build ${{ matrix.device }} --release
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md,README.md build/windows/x64/runner/Release/
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath tabryo-0.1.0-windows-x64.zip
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.md README.md build/linux/x64/release/bundle/
          tar -czf tabryo-0.1.0-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - name: Test extracted Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'tabryo-extracted'
          Expand-Archive -LiteralPath tabryo-0.1.0-windows-x64.zip -DestinationPath $destination
          $app = Start-Process -FilePath (Join-Path $destination 'tabryo.exe') -WorkingDirectory $destination -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 3
            if ($app.HasExited) { throw 'Extracted app exited during startup.' }
            $children = @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$($app.Id)")
            if ($children.Count -ne 0) { throw 'The app started a child process without a gesture.' }
            $app.Refresh()
            Write-Output "Extracted Release app working set: $([math]::Round($app.WorkingSet64 / 1MB, 1)) MiB; child processes: 0"
            # CloseMainWindow ignores hidden windows. Without /F, taskkill
            # sends the normal window-close request to this exact owned PID.
            taskkill /PID $app.Id
            if ($LASTEXITCODE -ne 0 -or -not $app.WaitForExit(5000) -or $app.ExitCode -ne 0) { throw 'Extracted app did not close normally.' }
          } finally {
            if (-not $app.HasExited) { $app.Kill(); $app.WaitForExit() }
          }
      - name: Test extracted Linux bundle
        if: runner.os == 'Linux'
        run: |
          destination="$RUNNER_TEMP/tabryo-extracted"
          mkdir "$destination"
          tar -xzf tabryo-0.1.0-linux-x64.tar.gz -C "$destination"
          xvfb-run -a sh -eu -c '
            cd "$1"
            ./tabryo & app=$!
            trap "kill $app 2>/dev/null || true" EXIT
            sleep 3
            kill -0 "$app"
            test -z "$(cat /proc/$app/task/$app/children)"
            awk "/VmRSS/ {print \"Extracted Release app RSS: \" \$2 \" KiB; child processes: 0\"}" /proc/$app/status
            kill "$app"
            wait "$app" || test "$?" -eq 143
          ' sh "$destination"
      - uses: actions/upload-artifact@v4
        with:
          name: tabryo-${{ matrix.device }}-${{ github.sha }}
          path: tabryo-0.1.0-*
          if-no-files-found: error

  archlinux:
    name: desktop (archlinux, linux)
    needs: desktop
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Install current signed Arch desktop packages
        run: |
          pacman -Syu --noconfirm --needed git curl unzip jq which gtk3 webkit2gtk-4.1 mesa ttf-dejavu xorg-server-xvfb xorg-xauth xdotool openbox dbus
          useradd --create-home desktop
          pacman -Q glibc gtk3 webkit2gtk-4.1 mesa
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: editor-linux-${{ github.sha }}
          path: .archlinux/editor
      - uses: actions/download-artifact@v4
        with:
          name: workbench-linux-${{ github.sha }}
          path: .archlinux/workbench
      - uses: actions/download-artifact@v4
        with:
          name: tabryo-linux-${{ github.sha }}
          path: .archlinux/release
      - name: Prepare native integration dependencies as an ordinary user
        run: |
          for bundle in editor workbench release; do
            tar -xzf .archlinux/$bundle/*.tar.gz -C .archlinux/$bundle
          done
          chown -R desktop:desktop "$GITHUB_WORKSPACE" "$FLUTTER_ROOT"
          runuser -u desktop -- env PATH="$FLUTTER_ROOT/bin:$PATH" bash -euo pipefail <<'TESTS'
          git config --global --add safe.directory "$FLUTTER_ROOT"
          flutter config --enable-linux-desktop --no-enable-android
          flutter pub get --enforce-lockfile
          TESTS
      - name: Arch Release editor and DevTools at 100 and 200 percent
        timeout-minutes: 6
        run: |
          runuser -u desktop -- env PATH="$FLUTTER_ROOT/bin:$PATH" bash -euo pipefail <<'TESTS'
          dbus-run-session -- xvfb-run -a .archlinux/editor/tabryo
          GDK_SCALE=2 GDK_DPI_SCALE=0.5 dbus-run-session -- xvfb-run -a -s '-screen 0 2560x1600x24' .archlinux/editor/tabryo
          TESTS
      - name: Arch Release workbench resources and shared windows
        timeout-minutes: 6
        run: |
          runuser -u desktop -- env PATH="$FLUTTER_ROOT/bin:$PATH" bash -euo pipefail <<'TESTS'
          dbus-run-session -- xvfb-run -a sh -eu -c 'openbox >/dev/null 2>&1 & wm=$!; trap "kill $wm 2>/dev/null || true" EXIT; .archlinux/workbench/tabryo'
          GDK_SCALE=2 GDK_DPI_SCALE=0.5 dbus-run-session -- xvfb-run -a -s '-screen 0 2560x1600x24' sh -eu -c 'openbox >/dev/null 2>&1 & wm=$!; trap "kill $wm 2>/dev/null || true" EXIT; .archlinux/workbench/tabryo'
          TESTS
      - name: Arch extracted distribution startup and shutdown
        run: |
          runuser -u desktop -- env PATH="$FLUTTER_ROOT/bin:$PATH" bash -euo pipefail <<'TESTS'
          dbus-run-session -- xvfb-run -a sh -eu -c '
            cd .archlinux/release
            ./tabryo & app=$!
            trap "kill $app 2>/dev/null || true" EXIT
            sleep 3
            kill -0 "$app"
            test -z "$(cat /proc/$app/task/$app/children)"
            awk "/VmRSS/ {print \"Arch extracted Release app RSS: \" \$2 \" KiB; child processes: 0\"}" /proc/$app/status
            kill "$app"
            wait "$app" || test "$?" -eq 143
          '
          TESTS
