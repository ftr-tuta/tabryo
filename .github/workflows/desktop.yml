name: Desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            device: windows
          - os: ubuntu-24.04
            device: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: dart run dartitect_cli:dartitect scan
      - run: flutter test --concurrency=1
      - name: Windows native terminal tests
        if: runner.os == 'Windows'
        run: flutter test integration_test/terminal_host_test.dart -d windows
      - name: Linux native terminal tests
        if: runner.os == 'Linux'
        run: xvfb-run -a flutter test integration_test/terminal_host_test.dart -d linux
      - run: flutter build ${{ matrix.device }} --release
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md,README.md build/windows/x64/runner/Release/
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath tabryo-0.1.0-windows-x64.zip
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.md README.md build/linux/x64/release/bundle/
          tar -czf tabryo-0.1.0-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: tabryo-${{ matrix.device }}-${{ github.sha }}
          path: tabryo-0.1.0-*
          if-no-files-found: error
